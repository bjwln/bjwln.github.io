      - date: 2026-08-02
        title: OMGs
        track: system
        summary: 多智能体研发不能只设计几个角色和提示词，还需要考虑模块之间的关系、信息如何流动，以及如何通过实验判断系统是否真正有效。
        link: OMGs论文解读
        order: 0
      - date: 2026-08-16
        title: 2026年LLM综述
        track: survey
        summary: 使研究者能够比较不同的架构、协作流程、通信方式和系统基础设施。它让多智能体研究不再只是讨论“怎样写一个 Agent”，而是可以系统地讨论：Agent 之间如何分工和协作？信息通过什么机制传递？系统如何管理记忆、工具和执行流程？如何应对成本、可靠性与协作效率问题？
        link: 'A survey on LLM-based multi-agent systems: workflow, infrastructure, and challenges'
        label: LLM综述
        order: 1
      - date: 2026-08-16
        title: AI Hospitals：从 Agent 协作走向临床工作流
        track: system
        summary: 它强调明确的角色、共享状态、临床工具与证据、安全控制和可审计的日志，并提出从安全、过程、结果和运维四个层面评估系统。医疗系统的价值不能只看最终答案是否正确，还要看每个环节是否完成了正确的任务交接、是否使用了适当的证据，以及整个流程是否可追踪。
        link: 'LLM-based multi-agent systems for clinical workflows: a survey of AI hospitals'
        label: AI hospitals
        order: 2
      - date: 2026-09-16
        title: Accountable Orchestration：从答案生成走向可问责的协作
        track: survey
        summary: 这篇综述把医学多智能体视为临床协调基础设施，而不只是生成答案的模型组合。当多个 Agent 共同给出医疗建议时，不能只记录最终结论，还应明确结论由什么证据支持、哪些 Agent 负责哪些判断、不同意见如何处理，以及谁来审核最终结果。
        link: 'Not just one agent: LLM-based multi-agent systems for medicine from answer generation to accountable workflow orchestration'
        label: Accountable Orchestration
        order: 3
      - date: 2026-09-20
        title: MedAgents：让不同专家参与多轮协作推理
        track: system
        summary: 单个 LLM 可能受到专业知识覆盖不足和推理偏差的影响。MedAgents 通过提示词角色化医学专家然后经过多轮协作，尝试激发模型已有的医学知识，并整合不同视角。它不专门训练新的医学模型，而是通过提示词来组织现有 LLM 来完成任务
        link: 'MedAgents: large language models as collaborators for zero-shot medical reasoning'
        label: MedAgents
        order: 4
      - date: 2026-09-23
        title: MDAgents：根据任务复杂度自适应组织团队
        track: system
        summary: 如果所有医疗问题都调用相同数量的 Agent、执行相同轮数的讨论，非常浪费计算资源；反过来，简单的单模型处理方式也可能不适合复杂病例。MDAgents 根据医疗问题的复杂程度选择协作结构：低复杂度问题可以由单个基层临床角色处理，中等复杂度问题采用 MDT，高复杂度问题则采用更复杂的综合医疗团队结构。
        link: 'MDAgents: an adaptive collaboration of LLMs for medical decision-making'
        label: MDAgents
        order: 5
      - date: 2026-10-10
        title: MDTeamGPT：把讨论结果结构化，并积累可复用经验
        track: system
        summary: 多轮讨论会不断积累对话历史。上下文越来越长时，重要分歧可能被淹没；如果系统只是保存历史对话，也未必能有效提取有价值的经验。MDTeamGPT 将每轮讨论整理为四类信息：一致意见、冲突意见、独立观点和综合信息，并将整理后的内容存入历史共享池。它还引入 CorrectKB 和 ChainKB，分别用于积累正确答案相关知识与推理过程经验。它推动了多智能体记忆从“保存对话文本”向“提取结构化协作经验”发展，使后续讨论能够有选择地利用历史信息，而不是反复读取全部对话。
        link: 'MDTeamGPT: a self-evolving LLM-based multi-agent framework for multi-disciplinary team medical consultation'
        label: (i) MDTeamGPT
        order: 6
      - date: 2026-10-12
        title: 2026 - EvoMDT a self-evolving multi-agent system for structured clinical decision-making in multi-cancer
        track: system
        summary: EvoMDT 提出了一种面向多癌种结构化临床决策的自进化多智能体系统（MAS），其创新不仅在于将多个医学 Agent 组织起来协同推理，更在于构建了一个融合医学知识检索、专业分工、安全约束、冲突协调与持续改进的完整决策框架：系统设计了 Diagnostic、Treatment、Safety、Monitoring 和 Coordinator 五个 Agent，分别负责诊断与分期、治疗方案制定、风险与禁忌证审查、纵向疗效监测以及跨 Agent 的意见协调；同时，通过整合临床指南、医学文献和临床病例，为决策提供知识依据，并利用加权共识机制形成结构化的 MDT 建议。在此基础上，EvoMDT 进一步引入反馈驱动的自进化机制，尝试根据专家反馈和任务表现调整提示词、共识权重及检索范围，并通过公开基准、真实患者病例和医生评价验证系统表现。因此，EvoMDT 对医学 MAS 的主要贡献，是将多智能体的专业化协作从单次的诊疗建议生成，拓展为强调临床证据 grounding、安全审查、意见协调、纵向监测与反馈优化的一体化决策框架；不过，这些设计上的创新并不意味着每个模块都采用了独立的传统算法实现，其实际效果仍应结合论文实验与具体代码实现来判断。
        link: 2026 - EvoMDT a self-evolving multi-agent system for structured clinical decision-making in multi-cancer
        label: 2026-EvoMDT
        order: 7
      - date: 2026-10-18
        title: '2025.11 - MTBBench: A Multimodal Sequential Clinical Decision-Making Benchmark in Oncology'
        track: system
        summary: 这篇论文 MTBBench 的独特贡献在于构建了一个面向肿瘤学多学科会诊（MDT）的多模态、纵向临床决策评测基准：它不再只让模型根据单次、静态的病例文本给出诊断或治疗建议，而是将患者在不同时间点积累的临床病历、病理图像、免疫组化（IHC）图像及其他相关信息纳入连续决策过程，并通过可调用的专业工具增强模型的信息分析能力，同时模拟临床过程中逐步请求患者资料、整合新证据并更新决策的工作方式。，MTBBench 的核心创新并非单纯提出一种新的 LLM 或多智能体协作算法，而是将多模态证据、纵向患者病程、工具增强推理与连续临床决策评估整合到同一基准中，以更贴近真实肿瘤 MDT 的方式评估 AI 的临床决策能力。
        link: MTBBench数据集+Agent
        label: MTBBench数据集+Agent
        order: 8
